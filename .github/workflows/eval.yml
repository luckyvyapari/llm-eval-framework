name: LLM Eval Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Run eval suite
        env:
          WORKERS_AI_URL: ${{ secrets.WORKERS_AI_URL }}
          WORKERS_AI_TOKEN: ${{ secrets.WORKERS_AI_TOKEN }}
          EVAL_PASS_THRESHOLD: "0.8"
        run: npm run eval
